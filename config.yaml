# ── Content Strategy ──────────────────────────────────────────────
niche: "AI Productivity Tools"
instagram_handle: "@contentengine2"
keywords:
  - "AI tools"
  - "productivity apps"
  - "automation"
  - "ChatGPT tips"
  - "work smarter"

brand_voice: >
  Conversational and slightly witty. Uses short, punchy sentences.
  Speaks like a knowledgeable friend who's genuinely excited about
  tech but doesn't talk down to people. Uses data and specific
  examples over vague claims. Occasionally uses humor but never
  at the audience's expense. Avoids corporate buzzwords.

# ── Content Sources ───────────────────────────────────────────────
rss_feeds:
  - "https://techcrunch.com/category/artificial-intelligence/feed/"
  - "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml"
  - "https://feeds.feedburner.com/TheHackersNews"

subreddits:
  - "artificial"
  - "productivity"
  - "SideProject"
  - "ChatGPT"

# ── Design ────────────────────────────────────────────────────────
brand_colors:
  background:    "#1a1a2e"
  secondary_bg:  "#16213e"
  text_primary:  "#ffffff"
  text_secondary: "#a0a0a0"
  accent:        "#e94560"

# Place Inter-Bold.ttf and Inter-Regular.ttf in fonts/ for best results.
# Falls back to Pillow default font if files are missing.
font_bold:    "./fonts/Inter-Bold.ttf"
font_regular: "./fonts/Inter-Regular.ttf"

output_dir: "./generated_content"

# ── Reels ─────────────────────────────────────────────────────────
# A "reel" here = the same carousel slides rendered as a vertical slideshow
# video (ffmpeg, $0). reel_ratio = fraction of posts published as reels vs
# carousels. Reels get more reach but the API can't attach IG trending audio.
reel_ratio: 0.4
reel_seconds_per_slide: 2.5

# ── Publishing Schedule ───────────────────────────────────────────
# publish.yml cron is in UTC. Pick UTC slots that land in your audience's
# active hours (this timezone). Once analytics has data, AnalyticsAgent
# reports the best-performing hours so these can be tuned.
audience_timezone: "Asia/Kolkata"
trend_region: "IN"   # YouTube trending region (ISO 3166)
posting_times:
  - "08:00"
  - "14:00"
  - "20:00"
posts_per_day: 3

# ── Secrets ───────────────────────────────────────────────────────
# All API keys and tokens are loaded from environment variables (.env locally,
# GitHub Actions secrets in CI). Do NOT add secrets here.
# Required env vars:
#   GEMINI_API_KEY, META_ACCESS_TOKEN, INSTAGRAM_USER_ID,
#   META_APP_ID, META_APP_SECRET, IMGBB_API_KEY,
#   SUPABASE_URL, SUPABASE_KEY
