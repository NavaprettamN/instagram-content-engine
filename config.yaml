# ── Content Strategy ──────────────────────────────────────────────
# The page is a Reddit meme account. The old AI/value-post pipeline
# (research → generate → publish) was removed 2026-07-11; meme.yml is the
# only content pipeline.
niche: "memes & relatable humor"
instagram_handle: "@contentengine2"

brand_voice: >
  Casual, funny, and relatable. Short punchy replies, meme-culture fluent,
  never corporate. Jokes with the audience, never at their expense.

# ── Design ────────────────────────────────────────────────────────
# Used by MemeAgent for text overlays on the reel.
brand_colors:
  background:    "#1a1a2e"
  secondary_bg:  "#16213e"
  text_primary:  "#ffffff"
  text_secondary: "#a0a0a0"
  accent:        "#e94560"

# Place Inter-Bold.ttf and Inter-Regular.ttf in fonts/ for best results.
# Falls back to Pillow default font if files are missing.
font_bold:    "./fonts/Inter-Bold.ttf"
font_regular: "./fonts/Inter-Regular.ttf"

output_dir: "./generated_content"

# ── Link-in-bio (GitHub Pages) ────────────────────────────────────
# Put the published Pages URL in your IG bio. "Latest Post" auto-fills with
# your newest IG permalink on each daily rebuild. The old AI-themed funnel
# (cheat-sheet lead magnet, affiliate tools page, Gumroad product) was removed
# in the memes-only pivot — add meme-relevant links here when monetization
# comes back (merch, shoutouts, a meme pack, etc.). build_linkbio only renders
# guide.html/tools.html when lead_magnet/affiliate config exists.
link_in_bio:
  title: "Daily Memes 😂"
  tagline: "Fresh memes from the best of Reddit, every day"
  profile_url: "https://instagram.com/contentengine2"
  links:
    - { emoji: "🆕", label: "My Latest Reel", url: "" }   # auto: newest permalink

# ── Audience ──────────────────────────────────────────────────────
# meme.yml cron is in UTC; slots are tuned to this timezone's active hours.
# AnalyticsAgent's weekly report suggests better hours once it has data.
audience_timezone: "Asia/Kolkata"

# Fallback Jamendo mood tags if the LLM mood pick fails (needs JAMENDO_CLIENT_ID).
reel_music_tags: "upbeat,corporate"

# ── Secrets ───────────────────────────────────────────────────────
# All API keys and tokens are loaded from environment variables (.env locally,
# GitHub Actions secrets in CI). Do NOT add secrets here.

# ── Meme reels (Phase F) ──────────────────────────────────────────
# Reddit meme reels with an embedded CC music bed, auto-published by meme.yml.
# (Native trending audio can't be attached via the API.) Keep to meme
# subreddits; credits are overlaid + in the caption.
meme_subreddits:
  - "memes"
  - "wholesomememes"
  - "MemeEconomy"
meme_min_score: 2000
memes_per_reel: 1        # one meme per reel — held long enough to read (was a fast 4-up dump)
meme_seconds_each: 6     # seconds each meme is on screen
