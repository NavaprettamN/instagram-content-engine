# ── Content Strategy ──────────────────────────────────────────────
niche: "AI, productivity & working smarter"
instagram_handle: "@contentengine2"
keywords:
  - "AI tools"
  - "productivity apps"
  - "automation"
  - "ChatGPT tips"
  - "work smarter"

# Content pillars (Phase E1): research spreads each day's 5 ideas across these,
# weighted. Keeps the account from being 100% AI-topic (caps reach).
content_pillars:
  - { name: "AI tools & workflows", weight: 4 }
  - { name: "productivity systems & habits (no AI needed)", weight: 2 }
  - { name: "making money / side-hustles with tech", weight: 2 }
  - { name: "contrarian takes & myth-busting about hustle culture or AI", weight: 1 }
  - { name: "relatable work-life truths & memeable observations", weight: 1 }

brand_voice: >
  Conversational and slightly witty. Uses short, punchy sentences.
  Speaks like a knowledgeable friend who's genuinely excited about
  tech but doesn't talk down to people. Uses data and specific
  examples over vague claims. Occasionally uses humor but never
  at the audience's expense. Avoids corporate buzzwords.

# ── Content Sources ───────────────────────────────────────────────
rss_feeds:
  - "https://techcrunch.com/category/artificial-intelligence/feed/"
  - "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml"
  - "https://feeds.feedburner.com/TheHackersNews"
  - "https://lifehacker.com/rss"   # non-AI productivity (pillar 2)

subreddits:
  - "artificial"
  - "productivity"
  - "SideProject"
  - "ChatGPT"
  - "getdisciplined"   # habits pillar
  - "Entrepreneur"     # money pillar

# ── Design ────────────────────────────────────────────────────────
brand_colors:
  background:    "#1a1a2e"
  secondary_bg:  "#16213e"
  text_primary:  "#ffffff"
  text_secondary: "#a0a0a0"
  accent:        "#e94560"

# Place Inter-Bold.ttf and Inter-Regular.ttf in fonts/ for best results.
# Falls back to Pillow default font if files are missing.
font_bold:    "./fonts/Inter-Bold.ttf"
font_regular: "./fonts/Inter-Regular.ttf"

output_dir: "./generated_content"

# ── Link-in-bio (GitHub Pages funnel) ─────────────────────────────
# Put the published Pages URL in your IG bio. "Latest Post" auto-fills with
# your newest IG permalink on each daily rebuild; fill the other URLs as the
# affiliate/lead-magnet/product tasks land.
link_in_bio:
  title: "AI Productivity Tools"
  tagline: "Daily AI tips to work smarter, not harder 🤖"
  profile_url: "https://instagram.com/contentengine2"
  links:
    - { emoji: "🆕", label: "My Latest Post",            url: "" }   # auto: newest permalink
    - { emoji: "🎁", label: "Free: The AI Tools Cheat Sheet", url: "" } # lead magnet — auto: guide.html
    - { emoji: "🛠️", label: "AI Tools I Recommend",       url: "" } # affiliate — auto: tools.html
    - { emoji: "🛒", label: "The AI Productivity Pack",    url: "https://9001784317547.gumroad.com/l/dkvmqk" } # product (task #9)

# ── Affiliate engine (#8) ─────────────────────────────────────────
# Replace the example URLs with YOUR real affiliate links (sign up for each
# tool's program). These render on the "Tools I Recommend" page (tools.html),
# linked from the bio. UTM tags are appended for click visibility.
lead_magnet:
  title: "The AI Tools Cheat Sheet"
  tagline: "My curated stack to work smarter — free 👇"
  # Paste your Kit/ConvertKit (or any ESP) inline form EMBED here to capture
  # emails on the guide page. Leave "" for an ungated free guide.
  signup_embed: '<script async data-uid="6bf19048b3" src="https://navaprettam-n.kit.com/6bf19048b3/index.js"></script>'

affiliate:
  # Sovrn Commerce auto-converts the real merchant URLs below into affiliate
  # links client-side (covered merchants only). Key is public by design (it ships
  # in the page JS). Add more tools freely — no affiliate URLs needed.
  sovrn_key: "397ce387a618e8a27eac7a307de7b5a1"
  utm_source: "instagram"
  utm_campaign: "bio_tools"
  tools:
    - { emoji: "🤖", name: "ChatGPT",  url: "https://chatgpt.com",       blurb: "The AI I use daily for writing & code" }
    - { emoji: "🎨", name: "Canva",    url: "https://www.canva.com",     blurb: "Design scroll-stopping carousels fast" }
    - { emoji: "✍️", name: "Notion",   url: "https://www.notion.so",     blurb: "Notes & docs that write themselves" }
    - { emoji: "🔎", name: "Perplexity", url: "https://www.perplexity.ai", blurb: "AI search with real sources" }
    - { emoji: "🎬", name: "CapCut",   url: "https://www.capcut.com",    blurb: "Auto-caption & edit reels fast" }

# ── Reels ─────────────────────────────────────────────────────────
# Format mix is 2 reels : 1 carousel (set in generate.yml via id % 3).
# Reels get more reach; the standout performers are the YouTube CC clips (clip.yml).
reel_seconds_per_slide: 2.5
reel_voice: "en-US-AriaNeural"   # free edge-tts neural voice for original reels
clip_source: "vimeo"   # vimeo (cookie-free, CI-friendly) or youtube (needs residential IP/proxy)
# Reels: YouTube clips are blocked from CI (datacenter IP). Until a working clip
# source is chosen, generate.yml makes the reels (voiceover reels). Flip false
# once clips run from a residential IP / proxy / Vimeo.
generate_reels: true
# Fallback Jamendo mood tags if the LLM mood pick fails (needs JAMENDO_CLIENT_ID).
reel_music_tags: "upbeat,corporate"

# ── Publishing Schedule ───────────────────────────────────────────
# publish.yml cron is in UTC. Pick UTC slots that land in your audience's
# active hours (this timezone). Once analytics has data, AnalyticsAgent
# reports the best-performing hours so these can be tuned.
audience_timezone: "Asia/Kolkata"
trend_region: "IN"   # YouTube trending region (ISO 3166)
posting_times:
  - "08:00"
  - "14:00"
  - "20:00"
posts_per_day: 3
# Daily content mix (publish.yml enforces this per UTC day; sum = posts/day).
daily_mix:
  reel: 2
  carousel: 1
# Quality gate: generated content scoring below this (1-10) is regenerated.
quality_threshold: 7

# ── Secrets ───────────────────────────────────────────────────────
# All API keys and tokens are loaded from environment variables (.env locally,
# GitHub Actions secrets in CI). Do NOT add secrets here.
# Required env vars:
#   GEMINI_API_KEY, META_ACCESS_TOKEN, INSTAGRAM_USER_ID,
#   META_APP_ID, META_APP_SECRET, IMGBB_API_KEY,
#   SUPABASE_URL, SUPABASE_KEY
