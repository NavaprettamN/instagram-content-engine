name: Link-in-bio — Build & Deploy to Pages

# Rebuilds the bio landing page daily (refreshes the auto "Latest Post" link and
# any config edits) and deploys it to GitHub Pages. One-time setup: repo
# Settings → Pages → Source = "GitHub Actions". Put the resulting URL in your IG bio.

on:
  schedule:
    - cron: "0 6 * * *"   # daily 06:00 UTC, before the day's posts
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install requests pyyaml

      - name: Build the page
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: python -m scripts.build_linkbio

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
