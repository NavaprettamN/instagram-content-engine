name: Clip Agent — CC YouTube → Reel (weekly)

# Heaviest workflow: downloads a Creative-Commons video, transcribes with Whisper
# (CPU), and reframes/captions a segment with ffmpeg. Runs weekly to respect
# Actions minutes + Whisper CPU cost. apt ffmpeg ensures libass (caption burn-in).

# Manual-only: YouTube bot-blocks downloads from GitHub's datacenter IPs, so the
# clipper is meant to run locally (residential IP) via `python -m scripts.clip_publish`.
# This dispatch entry is kept for when a PO-token/proxy setup is added.
on:
  schedule:
    - cron: "0 6 * * *"   # daily — clip a CC video into the publish queue (primary reel source)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render + host the clip but do NOT queue it (preview captions)"
        type: boolean
        default: true

jobs:
  clip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg (with libass for caption burn-in)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # yt-dlp needs a JS runtime to solve YouTube's "n" signature challenge
      # (otherwise only image formats are returned). yt-dlp auto-uses deno on PATH.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: pip install -r requirements.txt bgutil-ytdlp-pot-provider

      # Cookie-free YouTube auth: the bgutil provider mints PO tokens on demand,
      # so we don't depend on a YOUTUBE_COOKIES secret that expires in ~a day.
      - name: Start PO-token provider
        run: |
          docker run --name bgutil-provider -d -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider
          sleep 6

      - name: Clip a CC video and publish as a reel
        env:
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY:   ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_COOKIES:   ${{ secrets.YOUTUBE_COOKIES }}
          YT_POT:            "1"
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:      ${{ secrets.SUPABASE_KEY }}
          CLIP_DRY_RUN:      ${{ inputs.dry_run && '1' || '' }}
        run: |
          # PO-token provider (YT_POT=1) is primary; cookies are a fallback only.
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf '%s\n' "$YOUTUBE_COOKIES" > /tmp/yt_cookies.txt
            export YT_COOKIES_FILE=/tmp/yt_cookies.txt
            echo "Using YouTube cookies."
          else
            echo "No YOUTUBE_COOKIES secret — download will likely be bot-blocked."
          fi
          python -m scripts.clip_publish
