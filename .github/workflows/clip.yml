name: Clip Agent — CC video → Reel

# Clips a Creative-Commons video (Vimeo by default — cookie-free + CI-friendly)
# into a captioned vertical reel and QUEUES it (publish.yml posts it). Dispatch-
# only until verified working; then add a daily `schedule` to make clips primary.

on:
  schedule:
    - cron: "0 6 * * *"   # daily — Vimeo is cookie-free, so this runs unattended.
                           # Queues a clip when a good safe video is found, else skips.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render + host the clip but do NOT queue it (preview captions)"
        type: boolean
        default: true

jobs:
  clip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg (with libass for caption burn-in)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: pip install -r requirements.txt

      - name: Clip a CC video and queue it
        env:
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          VIMEO_TOKEN:       ${{ secrets.VIMEO_TOKEN }}
          YOUTUBE_API_KEY:   ${{ secrets.YOUTUBE_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:      ${{ secrets.SUPABASE_KEY }}
          CLIP_DRY_RUN:      ${{ inputs.dry_run && '1' || '' }}
        run: python -m scripts.clip_publish
