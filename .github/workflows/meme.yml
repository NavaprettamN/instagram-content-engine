name: Meme Reel — build + auto-publish

# Builds a Reddit meme reel and auto-publishes it to Instagram (+ reposts it to
# Stories) — fully hands-off. Alternates video memes (original audio) and image
# meme reels (embedded CC music); skips cleanly if nothing fresh. (Trending
# audio can't be attached via the API — the trade for zero manual work.)
on:
  schedule:
    - cron: "0 6,15 * * *"  # 06:00 & 15:00 UTC
  workflow_dispatch:
    inputs:
      format:
        description: "Reel format (auto = alternate per run)"
        type: choice
        options: [auto, video, images]
        default: auto

jobs:
  meme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: pip install -r requirements.txt

      - name: Build meme reel and publish
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          IMGBB_API_KEY:     ${{ secrets.IMGBB_API_KEY }}
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:      ${{ secrets.SUPABASE_KEY }}
          NTFY_TOPIC:        ${{ secrets.NTFY_TOPIC }}
          DISCORD_WEBHOOK:   ${{ secrets.DISCORD_WEBHOOK }}
          SLACK_WEBHOOK:     ${{ secrets.SLACK_WEBHOOK }}
          MEME_FORMAT:       ${{ inputs.format != 'auto' && inputs.format || '' }}
        run: python -m scripts.post_meme
