name: Meme Reel — build + auto-publish

# Builds a Reddit meme reel and auto-publishes it to Instagram (+ reposts it to
# Stories) — fully hands-off. Alternates video memes (original audio) and image
# meme reels (embedded CC music); skips cleanly if nothing fresh. (Trending
# audio can't be attached via the API — the trade for zero manual work.)
on:
  schedule:
    # 5 posts/day, tuned to Asia/Kolkata (IST = UTC+5:30) active hours.
    - cron: "0 3 * * *"    # 08:30 IST — morning
    - cron: "30 7 * * *"   # 13:00 IST — lunch
    - cron: "0 12 * * *"   # 17:30 IST — evening commute
    - cron: "0 15 * * *"   # 20:30 IST — prime
    - cron: "30 17 * * *"  # 23:00 IST — late night
  workflow_dispatch:
    inputs:
      format:
        description: "Reel format (auto = alternate per run)"
        type: choice
        options: [auto, video, images]
        default: auto

jobs:
  meme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: pip install -r requirements.txt

      - name: Build meme reel and publish
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          IMGBB_API_KEY:     ${{ secrets.IMGBB_API_KEY }}
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:      ${{ secrets.SUPABASE_KEY }}
          NTFY_TOPIC:        ${{ secrets.NTFY_TOPIC }}
          DISCORD_WEBHOOK:   ${{ secrets.DISCORD_WEBHOOK }}
          SLACK_WEBHOOK:     ${{ secrets.SLACK_WEBHOOK }}
          MEME_FORMAT:       ${{ inputs.format != 'auto' && inputs.format || '' }}
        run: python -m scripts.post_meme
