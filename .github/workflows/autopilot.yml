name: Autopilot — Full Chain (manual)

# One-click end-to-end test: research -> generate+design -> publish ONE real post.
# Manual only. Use to watch the whole pipeline run without waiting for the crons.

on:
  workflow_dispatch:

jobs:
  autopilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run full pipeline once
        env:
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          IMGBB_API_KEY:       ${{ secrets.IMGBB_API_KEY }}
          META_ACCESS_TOKEN:   ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID:   ${{ secrets.INSTAGRAM_USER_ID }}
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:        ${{ secrets.SUPABASE_KEY }}
        run: python -m scripts.autopilot
