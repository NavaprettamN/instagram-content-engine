name: Generate Agent — Content + Design

on:
  schedule:
    - cron: "0 */2 * * *"  # every 2 hours
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg (reel ideas render a slideshow video)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: pip install -r requirements.txt

      - name: Generate content and designs for approved ideas
        env:
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          IMGBB_API_KEY:       ${{ secrets.IMGBB_API_KEY }}
          JAMENDO_CLIENT_ID:   ${{ secrets.JAMENDO_CLIENT_ID }}
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:        ${{ secrets.SUPABASE_KEY }}
        run: |
          python -c "
          import json, yaml
          from agents.content_agent import ContentAgent
          from agents.design_agent import DesignAgent
          from agents.hashtag_agent import HashtagAgent
          from agents.publishing_agent import PublishingAgent
          from agents.voice_reel import VoiceReelAgent
          from agents.music_agent import MusicAgent
          from agents._db import get_ideas, update_idea

          config = yaml.safe_load(open('config.yaml'))
          ca = ContentAgent(config)
          da = DesignAgent(config)
          ha = HashtagAgent(config)
          pa = PublishingAgent(config)
          vra = VoiceReelAgent(config)
          ma = MusicAgent(config)

          approved = get_ideas(status='approved')
          errors = 0
          for idea in approved:
              if idea.get('generated_content'):
                  continue  # already processed
              try:
                  print(f'Processing idea {idea[\"id\"]}: {idea[\"hook\"]}')
                  hashtag_sets = ha.generate_hashtag_sets(idea['hook'])  # 3 rotating sets
                  base = f'{config[\"output_dir\"]}/carousel_{idea[\"id\"]}'
                  # Reels come from real YouTube clips (clip.yml) now; generate makes
                  # carousels unless generate_reels is explicitly turned on.
                  as_reel = config.get('generate_reels', False) and (idea['id'] % 3) != 0
                  if as_reel:
                      # ORIGINAL voiceover reel: script -> edge-tts -> synced captions
                      vs = ca.generate_voice_script(idea)
                      music = ma.pick_track(idea['hook'], f'{base}/music.mp3')  # CC track or None
                      reel = vra.build(vs.get('hook', idea['hook']), vs['script'],
                                       f'{base}/reel.mp4', music_path=(music['path'] if music else None))
                      media = [pa.upload_video_to_hosting(reel)]
                      content, caption, fmt = vs, vs.get('caption') or '', 'reel'
                      if music:
                          caption = (caption + '\n\n' + music['credit']).strip()  # CC attribution
                  else:
                      content = ca.generate_carousel(idea)
                      local_paths = da.generate_carousel_images(content, idea['id'])
                      media = [pa.upload_image_to_hosting(p) for p in local_paths]
                      caption, fmt = content.get('caption') or idea.get('caption_draft') or '', 'carousel'
                  update_idea(idea['id'],
                              generated_content=json.dumps(content),
                              image_paths=json.dumps(media),
                              hashtags=json.dumps(hashtag_sets),
                              caption_draft=caption,
                              content_type=fmt,
                              status='designed')
                  print(f'  -> designed as {fmt}, {len(media)} media hosted')
              except Exception as e:
                  # one bad idea (ffmpeg/Gemini/hosting) must not kill the batch
                  errors += 1
                  print(f'  !! idea {idea[\"id\"]} failed, skipping: {str(e)[:160]}')
          if errors and errors == len([i for i in approved if not i.get('generated_content')]):
              raise SystemExit(f'All {errors} ideas failed')  # surface a fully-broken run
          "
