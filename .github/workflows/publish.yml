name: Publish Agent — Post to Instagram

on:
  schedule:
    - cron: "0 */2 * * *"  # every 2h; the job gates to best/fallback hours + daily quota
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Publish oldest designed post
        env:
          META_ACCESS_TOKEN:   ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID:   ${{ secrets.INSTAGRAM_USER_ID }}
          IMGBB_API_KEY:       ${{ secrets.IMGBB_API_KEY }}
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:        ${{ secrets.SUPABASE_KEY }}
        run: |
          python -c "
          import json, yaml
          from datetime import datetime, timezone
          from agents.publishing_agent import PublishingAgent
          from agents.hashtag_agent import compose_caption
          from agents._db import get_ideas, update_idea, count_ideas, get_config

          config = yaml.safe_load(open('config.yaml'))

          # Gate: post up to posts_per_day/day, spaced out, whenever a run fires.
          # Exact-hour gating was brittle — GitHub cron is delayed 60-90 min, so
          # runs almost never land on the target hour and everything got skipped.
          # Quota + spacing is resilient to that and still spreads posts out.
          from collections import Counter
          now = datetime.now(timezone.utc)
          # Daily MIX: aim for this many of each type per day (default 2 reels + 1 carousel).
          mix = config.get('daily_mix', {'reel': 2, 'carousel': 1})
          ppd = sum(mix.values())
          min_gap_h = max(2, round(18 / ppd))  # ~6h apart for 3/day
          published = get_ideas(status='published')
          today = now.date().isoformat()
          todays = [p for p in published if (p.get('published_at') or '').startswith(today)]
          if len(todays) >= ppd:
              print(f'Daily quota reached ({len(todays)}/{ppd}); skipping.')
              exit(0)
          times = sorted(p['published_at'] for p in published if p.get('published_at'))
          if times:
              raw = times[-1].replace('Z', '+00:00')
              last = datetime.fromisoformat(raw)
              if last.tzinfo is None:
                  last = last.replace(tzinfo=timezone.utc)
              gap = (now - last).total_seconds() / 3600
              if gap < min_gap_h:
                  print(f'Only {gap:.1f}h since last post (< {min_gap_h}h); skipping.')
                  exit(0)

          designed = get_ideas(status='designed')
          if not designed:
              print('No designed posts ready to publish.')
              exit(0)

          # Pick a type still under its daily target that has something queued
          # (reels first — best reach). If the target type's queue is empty or all
          # targets are met, fall back to whatever's available so a slot isn't wasted.
          done = Counter(p.get('content_type') for p in todays)
          avail = Counter(p.get('content_type') for p in designed)
          chosen = None
          for t in ('reel', 'carousel'):
              if done.get(t, 0) < mix.get(t, 0) and avail.get(t, 0) > 0:
                  chosen = t
                  break
          if chosen is None:
              for t in ('reel', 'carousel'):
                  if avail.get(t, 0) > 0:
                      chosen = t
                      break
          # designed is newest-first, so [-1] is the oldest of the chosen group.
          group = [p for p in designed if p.get('content_type') == chosen] or designed
          post = group[-1]
          print(f'Daily mix so far: {dict(done)} / target {mix}; choosing {chosen}.')
          agent = PublishingAgent(config)
          paths = json.loads(post['image_paths']) if post.get('image_paths') else []
          caption = compose_caption(post, count_ideas('published'))  # rotated hashtag set appended

          print(f'Publishing ({post[\"content_type\"]}): {post[\"hook\"]}')
          if post['content_type'] == 'reel' and paths:
              result = agent.publish_reel(paths[0], caption)  # paths[0] = hosted MP4 URL
          elif post['content_type'] == 'carousel' and len(paths) > 1:
              result = agent.publish_carousel(paths, caption)
          elif paths:
              result = agent.publish_single_image(paths[0], caption)
          else:
              print('ERROR: no image paths found')
              exit(1)

          if not result.get('id'):
              # publish failed (e.g. Meta fetch error) — leave it 'designed' so the
              # next run retries instead of losing the post + miscounting quota.
              print(f'Publish FAILED, leaving designed for retry: {result}')
              exit(1)
          update_idea(post['id'],
                      status='published',
                      published_at=datetime.now(timezone.utc).isoformat(),
                      post_id=result.get('id'))
          print(f'Published! IG post ID: {result.get(\"id\")}')
          "
