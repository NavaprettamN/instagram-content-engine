name: Story Agent — Auto-promo to Stories

# Reposts the latest image post to Stories once (keeps Stories active + drives
# profile visits). API can't add link/poll stickers, so it's a plain image.

on:
  schedule:
    - cron: "0 9 * * *"   # daily 09:00 UTC, after the morning post
  workflow_dispatch:

jobs:
  story:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Post latest to Stories
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:      ${{ secrets.SUPABASE_KEY }}
        run: python -m scripts.post_story
