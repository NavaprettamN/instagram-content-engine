name: Comment Agent — Auto-reply

# Polls recent posts for new comments and replies on-brand (Gemini). No webhooks
# (those need a public server); runs every 2h for the early-engagement window.

on:
  schedule:
    - cron: "30 */2 * * *"  # every 2h, offset 30m from publish.yml
  workflow_dispatch:

jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Reply to new comments
        env:
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:      ${{ secrets.SUPABASE_KEY }}
        run: |
          python -c "
          import yaml
          from agents.comment_agent import CommentAgent
          CommentAgent(yaml.safe_load(open('config.yaml'))).run()
          "
